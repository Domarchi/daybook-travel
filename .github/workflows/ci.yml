name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx tsc --noEmit
      - run: npm run build
      # Chrome del runner; CDP nativo, sin descargas npm globales ni agent-browser.
      - run: google-chrome --version
      - run: npm run test:browser
      - run: npm run test:browser:recovery
        timeout-minutes: 10
