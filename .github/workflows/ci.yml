name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx tsc --noEmit
      - run: npm run build
      - uses: browser-actions/setup-chrome@v2
        id: chrome
        with:
          chrome-version: '154.0.8037.92'
          install-dependencies: true
      - name: Fijar contrato verificable de Chrome
        env:
          SETUP_CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto';
          import { chmod, lstat, readFile, realpath, writeFile } from 'node:fs/promises';
          import { join } from 'node:path';
          const path = await realpath(process.env.SETUP_CHROME_PATH ?? '');
          const info = await lstat(path);
          if (!info.isFile() || (info.mode & 0o022) !== 0) throw new Error('Chrome de setup no verificable');
          const sha256 = createHash('sha256').update(await readFile(path)).digest('hex');
          const contract = join(process.cwd(), '.travel-ci-chrome.json');
          await writeFile(contract, JSON.stringify({ version: 1, platform: process.platform, path, sha256 }), { flag: 'wx', mode: 0o400 });
          await chmod(contract, 0o400);
          NODE
      - run: npm run test:browser
        timeout-minutes: 5
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
      - run: npm run test:browser:recovery
        timeout-minutes: 10
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
