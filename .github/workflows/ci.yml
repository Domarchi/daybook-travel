name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx tsc --noEmit
      - run: npm run build
      - uses: browser-actions/setup-chrome@v2
        id: chrome
        with:
          chrome-version: '154.0.8037.92'
          install-dependencies: true
      - run: npm run test:browser
        timeout-minutes: 5
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
      - run: npm run test:browser:recovery
        timeout-minutes: 10
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
