name: CI

# Un solo disparador por cambio: las ramas se verifican como pull request y
# `main` después de cada merge. Con `push:` a secas todo corría dos veces y el
# `verify` del push era el que fallaba de forma intermitente.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx tsc --noEmit
      - run: npm run build
      - run: npm run test:browser
        timeout-minutes: 5
      - run: npm run test:browser:flujos
        timeout-minutes: 5
      - run: npm run test:browser:recovery
        timeout-minutes: 10
