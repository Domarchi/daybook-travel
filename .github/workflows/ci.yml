name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx tsc --noEmit
      - run: npm run build
      - uses: browser-actions/setup-chrome@v2
        id: chrome
        with:
          chrome-version: '154.0.8037.92'
          install-dependencies: true
      - name: Instalar Chrome CI en allowlist raíz
        env:
          SETUP_CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          set -euo pipefail
          test "$(basename -- "$SETUP_CHROME_PATH")" = chrome
          sudo test ! -e /opt/travel-ci-chrome
          sudo install -d -o root -g root -m 0755 /opt/travel-ci-chrome
          sudo cp -a -- "$(dirname -- "$SETUP_CHROME_PATH")" /opt/travel-ci-chrome/bundle
          sudo chown -R root:root /opt/travel-ci-chrome
          sudo chmod -R go-w /opt/travel-ci-chrome
          test "$(realpath /opt/travel-ci-chrome/bundle/chrome)" = /opt/travel-ci-chrome/bundle/chrome
      - run: npm run test:browser
        timeout-minutes: 5
      - run: npm run test:browser:recovery
        timeout-minutes: 10
